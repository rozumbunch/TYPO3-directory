  Rozumbunch\Directory\Controller\OrganisationController:
    public: true

  Rozumbunch\Directory\Controller\MapController:
    public: true

  Rozumbunch\Directory\PageTitle\DirectoryPageTitleProvider:
    public: true

  Rozumbunch\Directory\UserFunction\RecordLabel:
    public: true
