    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Configuration/*'
      - '../Classes/Dummy/*'

  Rozumbunch\Directory\Controller\DirectoryModuleController:
    public: true

  Rozumbunch\Directory\Controller\PersonController:
